<a
  class="card h-100 border-0 shadow-sm text-decoration-none text-dark overflow-hidden"
  [routerLink]="['/product', product().id]"
>
  <div class="bg-light p-4 text-center">
    <img
      class="img-fluid product-image"
      [src]="product().imgUrl"
      [alt]="product().brand + ' ' + product().model"
      loading="lazy"
    />
  </div>

  <div class="card-body d-flex flex-column">
    <span class="small text-muted">
      {{ product().brand }}
    </span>

    <span class="card-title fw-semibold mb-2">
      {{ product().model }}
    </span>

    <span class="fs-5 fw-bold mt-auto">
      {{ price() }}
    </span>
  </div>
</a>
