<form class="d-flex flex-column gap-4">

  <h2 class="h5 fw-bold mb-0">
    Opciones
  </h2>

  <!-- Almacenamiento -->
  <fieldset>
    <legend class="form-label fw-semibold">
      Almacenamiento
    </legend>

    <div class="d-flex flex-wrap gap-2">
      @for (s of storages(); track s.code) {
        <input
          type="radio"
          class="btn-check"
          name="storage"
          [id]="'storage-' + s.code"
          [value]="s.code"
          [checked]="storageCode() === s.code"
          (change)="storageCode.set(s.code)"
        />

        <label
          class="btn btn-outline-success"
          [for]="'storage-' + s.code"
        >
          {{ s.name }}
        </label>
      }
    </div>
  </fieldset>

  <!-- Color -->
  <fieldset>
    <legend class="form-label fw-semibold">
      Color
    </legend>

    <div class="d-flex flex-wrap gap-2">
      @for (c of colors(); track c.code) {
        <input
          type="radio"
          class="btn-check"
          name="color"
          [id]="'color-' + c.code"
          [value]="c.code"
          [checked]="colorCode() === c.code"
          (change)="colorCode.set(c.code)"
        />

        <label
          class="btn btn-outline-success"
          [for]="'color-' + c.code"
        >
          {{ c.name }}
        </label>
      }
    </div>
  </fieldset>

  <!-- Submit -->
  <button
    type="button"
    class="btn btn-primary w-100"
    [disabled]="!canAdd()"
    (click)="add()"
  >
    {{ adding() ? 'Añadiendo…  ' : 'Añadir a la cesta ' }} <i class="bi bi-cart me-2"></i>
  </button>

  @if (feedback(); as f) {
    <div
      class="alert mb-0 alert-dismissible"
      role="alert"
      [ngClass]="f.ok ? 'alert-success' : 'alert-danger'"
    >
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      <i class="bi"  [class.bi-check]="f.ok"></i> {{ f.text }}
    </div>
  }

</form>
